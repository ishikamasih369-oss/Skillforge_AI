<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillForge AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-brand">
                <a href="index.html" class="logo">
                    SkillForge<span>AI</span>
                </a>

                <h1>Welcome back.</h1>

                <p>
                    Continue your learning journey, track your
                    progress and move closer to your career goals.
                </p>
            </div>


            <div class="auth-card">

                <h2>Login</h2>

                <p class="auth-subtitle">
                    Sign in to continue to SkillForge AI.
                </p>


                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div class="forgot-password">
                        <a href="forgot-password.html">
                            Forgot password?
                        </a>
                    </div>


                    <button
                        type="submit"
                        class="primary-btn auth-btn"
                    >
                        Login
                    </button>

                </form>


                <p class="auth-footer">
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
